  <line x1="218" y1="338" x2="382" y2="338" stroke="#2C211E" stroke-width="1" />
  <text x="300" y="356" text-anchor="middle" fill="#736B65" font-family="Arial, sans-serif" font-size="7.5" font-weight="700" letter-spacing="2">PACKAGED COFFEE CONCEPT</text>
  <text x="300" y="392" text-anchor="middle" fill="#2C211E" font-family="Georgia, serif" font-size="26" font-weight="700" letter-spacing="2">NO. 02</text>

